<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>All India Taxi Service</title>
    <script>
      // GitHub Pages SPA redirect script
      // Converts the path to a query string so the SPA can restore it
      var pathSegmentsToKeep = 1; // 1 = username/repo (user/org pages site)

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
